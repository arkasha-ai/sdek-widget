version: '3'
services:
  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "5177:5177"
      - "8080:8080"
    user: "${UID}:${GID}"
    environment:
      - SDEK_CLIENT_ID=${SDEK_CLIENT_ID}
      - SDEK_CLIENT_SECRET=${SDEK_CLIENT_SECRET}
      - DADATA_API_KEY=${DADATA_API_KEY}
      - SDEK_ALLOWED_ORIGINS=${SDEK_ALLOWED_ORIGINS:-}
      - SDEK_DEBUG=${SDEK_DEBUG:-0}
      - SDEK_CACHE_DIR=${SDEK_CACHE_DIR:-/app}
