<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЗНАЕМ AI — Warm Authority</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,400;0,700;0,800;1,700;1,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #F5F0EB;
    --text: #1C1917;
    --accent: #DC2626;
    --subtle: #78716C;
    --border: #D6CFC6;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    position: relative;
  }

  /* Grain texture via SVG filter */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    background-repeat: repeat;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 80px;
    height: 80px;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: var(--text);
    text-decoration: none;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 1px 5px;
    line-height: 1.4;
  }

  .nav-issue {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--subtle);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* HERO */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px;
    padding-bottom: 40px;
  }

  .issue-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--subtle);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .issue-label::before {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background-color: var(--subtle);
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: clamp(3.5rem, 9vw, 8rem);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--text);
    margin-bottom: 36px;
    max-width: 900px;
  }

  h1 .accent {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 1.3vw, 1.15rem);
    font-weight: 400;
    color: var(--subtle);
    max-width: 480px;
    line-height: 1.65;
    margin-bottom: 48px;
    border-left: 2px solid var(--border);
    padding-left: 20px;
  }

  .cta-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 60px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    background-color: var(--text);
    color: var(--bg);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 16px 40px;
    text-decoration: none;
    transition: background-color 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-primary:hover {
    background-color: #000;
  }

  .cta-note {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--subtle);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* METRICS */
  .metrics {
    display: flex;
    align-items: stretch;
    border-top: 1px solid var(--border);
    padding-top: 36px;
    gap: 0;
  }

  .metric {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 64px;
    margin-right: 64px;
    position: relative;
  }

  .metric::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background-color: var(--border);
  }

  .metric:last-child::after {
    display: none;
  }

  .metric-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.5rem, 4vw, 3.5rem);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .metric-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--subtle);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    max-width: 160px;
  }
</style>
</head>
<body>
<div class="page">
  <nav>
    <a href="#" class="logo">
      ЗНАЕМ
      <span class="logo-badge">AI</span>
    </a>
    <span class="nav-issue">AI-студия</span>
  </nav>

  <main class="hero">
    <p class="issue-label">Делаем AI с 2022 года</p>
    <h1>Делаем AI,<br>который <span class="accent">работает</span></h1>
    <p class="subtitle">Персональные агенты, автоматизация бизнеса, синхронный перевод. Под ключ.</p>
    <div class="cta-group">
      <a href="#" class="btn-primary">Обсудить задачу →</a>
      <span class="cta-note">AI-аудит — бесплатно</span>
    </div>
    <div class="metrics">
      <div class="metric">
        <span class="metric-value">4+</span>
        <span class="metric-label">Продукта в продакшене</span>
      </div>
      <div class="metric">
        <span class="metric-value">2</span>
        <span class="metric-label">Года в AI</span>
      </div>
      <div class="metric">
        <span class="metric-value">On-prem</span>
        <span class="metric-label">Без утечки данных</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>
