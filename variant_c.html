<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЗНАЕМ AI — Dark Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #0D0D0D;
    --text-primary: #FAFAFA;
    --text-secondary: #71717A;
    --accent: #6366F1;
    --accent-violet: #7C3AED;
    --border: rgba(255,255,255,0.08);
    --glass-bg: rgba(255,255,255,0.04);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    position: relative;
  }

  /* Animated grid */
  .grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .grid-bg::before {
    content: '';
    position: absolute;
    inset: -100px;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: grid-drift 20s linear infinite;
  }

  @keyframes grid-drift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(80px, 80px); }
  }

  /* Ambient light */
  .ambient {
    position: fixed;
    top: -200px;
    right: -200px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(124,58,237,0.08) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .ambient-bottom {
    position: fixed;
    bottom: -300px;
    left: -150px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
    height: 72px;
    border-bottom: 1px solid var(--border);
    background: transparent;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    text-decoration: none;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    line-height: 1.4;
    box-shadow: 0 0 8px rgba(99,102,241,0.3);
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-link {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-link:hover {
    color: var(--text-primary);
  }

  .nav-cta {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 7px 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .nav-cta:hover {
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(99,102,241,0.2);
  }

  /* HERO */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    padding: 6px 16px;
    margin-bottom: 36px;
    width: fit-content;
  }

  .tag-dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .tag-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 900;
    font-size: clamp(3rem, 8vw, 7rem);
    line-height: 1.0;
    letter-spacing: -0.04em;
    color: var(--text-primary);
    margin-bottom: 28px;
    max-width: 900px;
  }

  h1 .accent {
    color: var(--accent);
    text-shadow: 0 0 40px rgba(99,102,241,0.5), 0 0 80px rgba(99,102,241,0.2);
  }

  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    font-weight: 400;
    color: var(--text-secondary);
    max-width: 500px;
    line-height: 1.7;
    margin-bottom: 48px;
  }

  .cta-group {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 56px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    background-color: var(--accent);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 32px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.01em;
  }

  .btn-primary:hover {
    background-color: #4F46E5;
    box-shadow: 0 0 24px rgba(99,102,241,0.5), 0 0 48px rgba(99,102,241,0.2);
  }

  .cta-note {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }

  /* METRICS — glassmorphism card */
  .metrics-card {
    display: inline-flex;
    align-items: stretch;
    gap: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    padding: 28px 40px;
  }

  .metric {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 48px;
    margin-right: 48px;
    position: relative;
  }

  .metric::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
  }

  .metric:last-child {
    padding-right: 0;
    margin-right: 0;
  }

  .metric:last-child::after {
    display: none;
  }

  .metric-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.8rem, 3vw, 2.5rem);
    font-weight: 900;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .metric-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="ambient"></div>
<div class="ambient-bottom"></div>

<div class="page">
  <nav>
    <a href="#" class="logo">
      ЗНАЕМ
      <span class="logo-badge">AI</span>
    </a>
    <div class="nav-right">
      <a href="#" class="nav-link">Услуги</a>
      <a href="#" class="nav-link">Кейсы</a>
      <a href="#" class="nav-cta">Обсудить задачу</a>
    </div>
  </nav>

  <main class="hero">
    <div class="tag">
      <span class="tag-dot"></span>
      <span class="tag-text">AI-студия полного цикла</span>
    </div>
    <h1>Делаем AI,<br>который <span class="accent">работает</span></h1>
    <p class="subtitle">Персональные агенты, автоматизация бизнеса, синхронный перевод. Под ключ.</p>
    <div class="cta-group">
      <a href="#" class="btn-primary">Обсудить задачу →</a>
      <span class="cta-note">AI-аудит — бесплатно</span>
    </div>
    <div class="metrics-card">
      <div class="metric">
        <span class="metric-value">4+</span>
        <span class="metric-label">Продукта в продакшене</span>
      </div>
      <div class="metric">
        <span class="metric-value">2</span>
        <span class="metric-label">Года в AI</span>
      </div>
      <div class="metric">
        <span class="metric-value">On-prem</span>
        <span class="metric-label">Без утечки данных</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>
