<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap');
  body { width:1080px; height:1080px; overflow:hidden; }

  .card {
    width:1080px; height:1080px;
    background:#2C1F14;
    position:relative;
    font-family:'Manrope', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* warm radial glow */
  .card::before {
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse 70% 55% at 50% 42%, rgba(160,110,65,0.28) 0%, transparent 65%);
  }

  .headline {
    margin-top:54px;
    text-align:center;
    z-index:2;
  }
  .headline .eyebrow {
    font-weight:500; font-size:17px;
    letter-spacing:0.2em; text-transform:uppercase;
    color:#8B6A4E; margin-bottom:12px;
  }
  .headline h1 {
    font-family:'Unbounded', sans-serif;
    font-weight:900; font-size:54px;
    color:#F5EDE0; line-height:1;
    letter-spacing:-0.01em;
  }

  .product-center {
    position:absolute;
    top:155px; left:50%;
    transform:translateX(-50%);
    width:820px; height:560px;
    display:flex; align-items:center; justify-content:center;
  }
  .product-center img {
    max-width:100%; max-height:100%;
    object-fit:contain;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
  }

  .places {
    position:absolute;
    bottom:52px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:24px;
    padding: 0 60px;
    z-index:10;
  }
  .place {
    flex:1;
    background:rgba(245,237,224,0.08);
    border:1px solid rgba(245,237,224,0.14);
    border-radius:24px;
    padding: 28px 16px 24px;
    text-align:center;
    backdrop-filter:blur(4px);
  }
  .place .icon {
    font-size:40px;
    line-height:1;
    margin-bottom:12px;
    display:block;
  }
  .place .name {
    font-family:'Unbounded', sans-serif;
    font-weight:700; font-size:20px;
    color:#F5EDE0;
    display:block;
    margin-bottom:6px;
  }
  .place .desc {
    font-size:15px;
    color:#9C846A;
    font-weight:500;
  }
</style>
</head>
