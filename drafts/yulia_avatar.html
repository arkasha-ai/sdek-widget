<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px;
    background: #FFF5F0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .card {
    width: 700px;
    height: 700px;
    background: linear-gradient(145deg, #FFE4D6 0%, #FFF0E8 40%, #E8F4FF 100%);
    border-radius: 40px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 40px;
    box-shadow: 0 20px 60px rgba(200,100,50,0.15);
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: #FF8C6B;
    border-radius: 50%;
    opacity: 0.15;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -40px;
    width: 240px; height: 240px;
    background: #6B9FFF;
    border-radius: 50%;
    opacity: 0.12;
  }
  .avatar {
    width: 220px;
    height: 220px;
    background: linear-gradient(135deg, #FFB088, #FF8C6B);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    box-shadow: 0 8px 30px rgba(255,140,107,0.4);
    z-index: 1;
    margin-top: 20px;
  }
  .name {
    font-size: 38px;
    font-weight: 900;
    color: #3A2010;
    margin-top: 28px;
    z-index: 1;
  }
  .nick {
    font-size: 22px;
    color: #FF8C6B;
    margin-top: 6px;
    font-weight: 600;
    z-index: 1;
  }
  .desc {
    font-size: 17px;
    color: #7A6055;
    text-align: center;
    margin-top: 20px;
    line-height: 1.6;
    z-index: 1;
    max-width: 480px;
  }
  .tags {
    display: flex;
    gap: 10px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 1;
  }
  .tag {
    background: rgba(255,140,107,0.15);
    color: #C4603A;
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .emoji-row {
    display: flex;
    gap: 16px;
    margin-top: 36px;
    font-size: 36px;
    z-index: 1;
  }
  .emoji-row span {
    animation: bounce 2s ease-in-out infinite;
  }
  .emoji-row span:nth-child(2) { animation-delay: 0.2s; }
  .emoji-row span:nth-child(3) { animation-delay: 0.4s; }
  .emoji-row span:nth-child(4) { animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
</style>
</head>
<body>
<div class="card">
  <div class="avatar">👩‍🍳</div>
  <div class="name">Юлия</div>
  <div class="nick">@kitlerjulia</div>
  <div class="desc">
    Создаёт контент для кафе и клиник.<br>
    Энергичная, творческая, с идеями<br>
    на каждый день. Делает сторис<br>
    лучше чем кто-либо.
  </div>
  <div class="tags">
    <span class="tag">Кафе ЛуЛу</span>
    <span class="tag">SMM</span>
    <span class="tag">Сторисмейкер</span>
    <span class="tag">Пенза</span>
  </div>
  <div class="emoji-row">
    <span>🍳</span>
    <span>📱</span>
    <span>❤️</span>
    <span>👻</span>
  </div>
</div>
</body>
</html>
