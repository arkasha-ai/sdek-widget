<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDEK + OpenStreetMap</title>

    <!-- Leaflet OSM -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- CDEK Widget -->
    <script src="https://widget.cdek.ru/widget/widget.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 18px;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-osm {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .badge-cdek {
            background: #fff3e0;
            color: #e65100;
        }

        #cdek-widget {
            padding: 18px;
            min-height: 500px;
        }

        /* Leaflet map overrides for compact look */
        #osm-map {
            height: 500px;
            width: 100%;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .info-bar {
            max-width: 1400px;
            margin: 16px auto 0;
            padding: 12px 18px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 13px;
            color: #1565c0;
            text-align: center;
        }

        .info-bar.error {
            background: #ffebee;
            color: #c62828;
        }

        .info-bar.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Marker pulse animation for selected point */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .selected-marker {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Custom map marker */
        .custom-marker {
            background: #1976d2;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .custom-marker.selected {
            background: #f44336;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

<h1>CDEK + OpenStreetMap Integration</h1>

<div class="container">
    <!-- CDEK Panel -->
    <div class="panel">
        <div class="panel-header">
            <span>CDEK Widget</span>
            <span class="badge badge-cdek">Official</span>
        </div>
        <div id="cdek-widget"></div>
    </div>

    <!-- OSM Panel -->
    <div class="panel">
        <div class="panel-header">
            <span>OpenStreetMap</span>
            <span class="badge badge-osm">Leaflet</span>
        </div>
        <div id="osm-map"></div>
    </div>
</div>

<div class="info-bar" id="info-bar">
    Click on the map to select a delivery point. Selected coordinates will be sent to the CDEK widget.
</div>

<script>
    // ================================================================
    // SHARED STATE — синхронизация между CDEK и OSM
    // ================================================================
    const DeliveryState = {
        // [lat, lng]
        selectedCoords: null,
        // { code, name, address, location: {lat, lng}, city_code, ... }
        selectedOffice: null,
        // [lat, lng]
        mapCenter: [55.7558, 37.6173], // Moscow default
        zoom: 10,

        listeners: [],

        setCoords(coords, source) {
            this.selectedCoords = coords;
            this._notify('coords', coords, source);
        },

        setOffice(office, source) {
            this.selectedOffice = office;
            if (office && office.location) {
                this.selectedCoords = [office.location.lat, office.location.lng];
                this.mapCenter = this.selectedCoords;
                this.zoom = 15;
            }
            this._notify('office', office, source);
        },

        setMapCenter(coords, source) {
            this.mapCenter = coords;
            this._notify('mapCenter', coords, source);
        },

        onUpdate(callback) {
            this.listeners.push(callback);
        },

        _notify(event, data, source) {
            this.listeners.forEach(cb => cb(event, data, source));
        }
    };


    // ================================================================
    // OSM MAP (Leaflet)
    // ================================================================
    let map, osmMarker, circleRadius;

    function initOSM() {
        map = L.map('osm-map', {
            center: DeliveryState.mapCenter,
            zoom: DeliveryState.zoom,
            zoomControl: true
        });

        // OSM tiles (free, no API key)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Nominatim search
        initSearch();

        // Click on map = select point
        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;
            DeliveryState.setCoords([lat, lng], 'osm');

            // Reverse geocode
            const address = await reverseGeocode(lat, lng);
            showMarker(lat, lng, address);
            updateInfoBar(`Selected: ${address || `${lat.toFixed(5)}, ${lng.toFixed(5)}`}`, 'success');
        });

        // Sync center from other source
        DeliveryState.onUpdate((event, data, source) => {
            if (source === 'cdek' || source === 'init') return; // avoid loop

            if (event === 'mapCenter' && data) {
                map.setView(data, DeliveryState.zoom);
            }
            if (event === 'office' && data && data.location) {
                const { lat, lng } = data.location;
                map.setView([lat, lng], 15);
                showMarker(lat, lng, formatOfficeAddress(data));
            }
        });

        // Watch for CDEK updates
        DeliveryState.onUpdate((event, data, source) => {
            if (source === 'osm') return;
            if (event === 'office' && data) {
                updateCDEKFromOSM();
            }
        });
    }


    // ================================================================
    // MARKER
    // ================================================================
    function showMarker(lat, lng, label) {
        if (osmMarker) map.removeLayer(osmMarker);
        if (circleRadius) map.removeLayer(circleRadius);

        // Circle to show precision
        circleRadius = L.circle([lat, lng], {
            radius: 200,
            color: '#1976d2',
            fillColor: '#1976d2',
            fillOpacity: 0.1,
            weight: 1
        }).addTo(map);

        // Marker
        osmMarker = L.marker([lat, lng], {
            icon: L.divIcon({
                className: 'custom-marker selected',
                iconSize: [20, 20],
                iconAnchor: [10, 10],
                popupAnchor: [0, -14]
            })
        }).addTo(map);

        if (label) {
            osmMarker.bindPopup(`<b>Selected point</b><br>${label}`).openPopup();
        }

        map.setView([lat, lng], 15);
    }


    // ================================================================
    // GEOCODING (Nominatim — free, no API key)
    // ================================================================
    async function reverseGeocode(lat, lng) {
        try {
            const res = await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ru`,
                { headers: { 'User-Agent': 'CDEK-OSM-Demo/1.0' } }
            );
            const data = await res.json();
            return data.display_name || null;
        } catch (e) {
            return null;
        }
    }

    async function searchAddress(query) {
        try {
            const res = await fetch(
                `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&accept-language=ru`,
                { headers: { 'User-Agent': 'CDEK-OSM-Demo/1.0' } }
            );
            const results = await res.json();
            return results.map(r => ({
                lat: parseFloat(r.lat),
                lng: parseFloat(r.lon),
                display_name: r.display_name
            }));
        } catch (e) {
            return [];
        }
    }


    // ================================================================
    // SEARCH UI (inside map)
    // ================================================================
    function initSearch() {
        const searchControl = L.control({ position: 'topleft' });

        searchControl.onAdd = function () {
            const div = L.DomUtil.create('div', 'leaflet-search-box');
            div.innerHTML = `
                <div style="background:white; padding:10px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15); min-width:260px;">
                    <input
                        id="osm-search-input"
                        type="text"
                        placeholder="Search address..."
                        style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; outline:none;"
                    />
                    <ul id="osm-search-results" style="list-style:none; margin:6px 0 0; padding:0; max-height:200px; overflow-y:auto;"></ul>
                </div>
            `;
            return div;
        };

        searchControl.addTo(map);

        const input = document.getElementById('osm-search-input');
        let searchTimeout;

        input.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = e.target.value.trim();
                if (query.length < 3) return;

                const results = await searchAddress(query);
                renderSearchResults(results);
            }, 500);
        });
    }

    function renderSearchResults(results) {
        const ul = document.getElementById('osm-search-results');
        if (!results.length) {
            ul.innerHTML = '<li style="font-size:12px;color:#999;padding:4px;">No results found</li>';
            return;
        }

        ul.innerHTML = results.map(r => `
            <li
                class="search-result-item"
                style="padding:6px 8px; cursor:pointer; font-size:12px; border-radius:4px;"
                onmouseover="this.style.background='#f0f0f0'"
                onmouseout="this.style.background='transparent'"
                onclick="selectSearchResult(${r.lat}, ${r.lng}, '${r.display_name.replace(/'/g, "\\'")}')"
            >
                ${r.display_name.split(',').slice(0, 3).join(',')}
            </li>
        `).join('');
    }

    function selectSearchResult(lat, lng, displayName) {
        DeliveryState.setCoords([lat, lng], 'osm');
        showMarker(lat, lng, displayName);
        updateInfoBar(`Found: ${displayName.split(',').slice(0, 3).join(',')}`, 'success');

        // Update CDEK widget if it supports programmatic address
        syncToCDEKWidget(lat, lng, displayName);
    }


    // ================================================================
    // CDEK WIDGET
    // ================================================================
    let cdekWidget;

    function initCDEK() {
        cdekWidget = new window.CDEKWidget({
            apiKey: 'demo',          // Replace with your real CDEK API key
            debug: true,
            defaultLocation: 'Moscow',
            hideDeliveryOptions: {
                'OFFICE': false,
                'DOOR': false
            },
            onReady() {
                updateInfoBar('CDEK Widget loaded. Click on the map or search to select a point.', '');
                DeliveryState._notify('init', null, 'cdek');
            },
            onChoose(data) {
                // User chose an office in CDEK widget
                console.log('[CDEK] onChoose:', data);
                if (data && data.location) {
                    DeliveryState.setOffice({
                        location: { lat: data.location.lat, lng: data.location.lng },
                        address: data.address,
                        name: data.name
                    }, 'cdek');
                }
            },
            onCalculate(data) {
                console.log('[CDEK] Calculated:', data);
            }
        });

        cdekWidget.mount(document.getElementById('cdek-widget'));

        // Listen to our state changes
        DeliveryState.onUpdate((event, data, source) => {
            if (source === 'osm' && event === 'coords') {
                syncToCDEKWidget(data[0], data[1], null);
            }
        });
    }


    // Sync OSM selection → CDEK widget
    function syncToCDEKWidget(lat, lng, address) {
        if (!cdekWidget) return;

        // CDEK widget API: we can set location programmatically
        // via the widget's internal state if it supports it
        // Otherwise, this is a known limitation — CDEK widget manages its own map
        console.log('[Sync] OSM → CDEK:', { lat, lng, address });
    }

    function updateCDEKFromOSM() {
        // If CDEK widget has a method to set the address/coords, call it here
        // Based on the source code, Widget has setLocation() but it's internal
        // The widget primarily uses its own map for selection
        console.log('[Sync] CDEK should reflect OSM selection');
    }


    // ================================================================
    // HELPERS
    // ================================================================
    function formatOfficeAddress(office) {
        if (!office) return '';
        const parts = [office.address, office.name].filter(Boolean);
        return parts.join(' — ');
    }

    function updateInfoBar(message, type) {
        const bar = document.getElementById('info-bar');
        bar.textContent = message;
        bar.className = 'info-bar ' + (type || '');
    }


    // ================================================================
    // INIT
    // ================================================================
    document.addEventListener('DOMContentLoaded', () => {
        initOSM();
        initCDEK();
    });
</script>

</body>
</html>
