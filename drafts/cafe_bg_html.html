<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }

  .bg {
    width: 1080px;
    height: 1080px;
    background: #00C9B1;
    position: relative;
    overflow: hidden;
  }

  /* Конфетти */
  .confetti {
    position: absolute;
    border-radius: 2px;
  }

  /* Шарики SVG */
  .balloons {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* Рамка */
  .frame {
    position: absolute;
    top: 80px; left: 80px;
    right: 80px; bottom: 80px;
    border: 6px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    pointer-events: none;
  }

  /* Кофе внизу по центру */
  .coffee {
    position: absolute;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 140px;
    line-height: 1;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.15));
  }

  /* Звёзды */
  .star {
    position: absolute;
    font-size: 60px;
    opacity: 0.9;
  }

  /* Гирлянда */
  .bunting {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
  }
</style>
</head>
<body>
<div class="bg">

  <!-- Конфетти -->
  <div class="confetti" style="width:18px;height:28px;background:#FF6B6B;top:60px;left:120px;transform:rotate(25deg)"></div>
  <div class="confetti" style="width:14px;height:22px;background:#FFD600;top:140px;left:200px;transform:rotate(-15deg)"></div>
  <div class="confetti" style="width:20px;height:14px;background:#fff;top:90px;left:340px;transform:rotate(40deg)"></div>
  <div class="confetti" style="width:12px;height:20px;background:#FF6B6B;top:200px;left:60px;transform:rotate(-30deg)"></div>
  <div class="confetti" style="width:16px;height:26px;background:#4ECDC4;top:300px;left:90px;transform:rotate(20deg)"></div>
  <div class="confetti" style="width:22px;height:12px;background:#FFD600;top:400px;left:40px;transform:rotate(-45deg)"></div>
  <div class="confetti" style="width:14px;height:24px;background:#fff;top:500px;left:120px;transform:rotate(10deg)"></div>
  <div class="confetti" style="width:18px;height:14px;background:#FF6B6B;top:600px;left:70px;transform:rotate(-20deg)"></div>
  <div class="confetti" style="width:12px;height:20px;background:#FFD600;top:700px;left:140px;transform:rotate(35deg)"></div>
  <div class="confetti" style="width:20px;height:16px;background:#4ECDC4;top:800px;left:50px;transform:rotate(-10deg)"></div>
  <div class="confetti" style="width:14px;height:22px;background:#fff;top:900px;left:180px;transform:rotate(28deg)"></div>
  <!-- правая сторона -->
  <div class="confetti" style="width:18px;height:28px;background:#FFD600;top:80px;right:100px;transform:rotate(-25deg)"></div>
  <div class="confetti" style="width:14px;height:20px;background:#FF6B6B;top:180px;right:60px;transform:rotate(15deg)"></div>
  <div class="confetti" style="width:22px;height:14px;background:#fff;top:280px;right:130px;transform:rotate(-40deg)"></div>
  <div class="confetti" style="width:16px;height:26px;background:#4ECDC4;top:380px;right:80px;transform:rotate(30deg)"></div>
  <div class="confetti" style="width:12px;height:18px;background:#FFD600;top:480px;right:50px;transform:rotate(-15deg)"></div>
  <div class="confetti" style="width:20px;height:12px;background:#FF6B6B;top:580px;right:110px;transform:rotate(20deg)"></div>
  <div class="confetti" style="width:14px;height:24px;background:#fff;top:680px;right:70px;transform:rotate(-35deg)"></div>
  <div class="confetti" style="width:18px;height:16px;background:#FFD600;top:780px;right:140px;transform:rotate(12deg)"></div>
  <div class="confetti" style="width:12px;height:20px;background:#FF6B6B;top:880px;right:90px;transform:rotate(-28deg)"></div>
  <!-- центр верх -->
  <div class="confetti" style="width:16px;height:24px;background:#FFD600;top:40px;left:450px;transform:rotate(18deg)"></div>
  <div class="confetti" style="width:20px;height:14px;background:#FF6B6B;top:30px;left:600px;transform:rotate(-22deg)"></div>
  <div class="confetti" style="width:14px;height:22px;background:#fff;top:50px;left:750px;transform:rotate(32deg)"></div>
  <!-- низ -->
  <div class="confetti" style="width:18px;height:14px;background:#FFD600;bottom:60px;left:240px;transform:rotate(-18deg)"></div>
  <div class="confetti" style="width:14px;height:22px;background:#FF6B6B;bottom:40px;left:380px;transform:rotate(25deg)"></div>
  <div class="confetti" style="width:20px;height:16px;background:#fff;bottom:80px;right:300px;transform:rotate(-12deg)"></div>
  <div class="confetti" style="width:12px;height:20px;background:#4ECDC4;bottom:50px;right:200px;transform:rotate(38deg)"></div>

  <!-- SVG: шарики, звёзды, гирлянда -->
  <svg class="balloons" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Гирлянда -->
    <polyline points="0,60 120,110 200,55 320,115 420,50 540,110 640,50 760,110 860,55 980,110 1080,60"
      fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
    <!-- Треугольники гирлянды -->
    <polygon points="80,80 130,80 105,115" fill="#FF6B6B" opacity="0.9"/>
    <polygon points="190,65 240,65 215,100" fill="#FFD600" opacity="0.9"/>
    <polygon points="330,80 380,80 355,115" fill="#fff" opacity="0.8"/>
    <polygon points="450,65 500,65 475,100" fill="#FF6B6B" opacity="0.9"/>
    <polygon points="580,75 630,75 605,110" fill="#FFD600" opacity="0.9"/>
    <polygon points="700,65 750,65 725,100" fill="#fff" opacity="0.8"/>
    <polygon points="820,80 870,80 845,115" fill="#FF6B6B" opacity="0.9"/>
    <polygon points="940,65 990,65 965,100" fill="#FFD600" opacity="0.9"/>

    <!-- Шарик левый розовый -->
    <ellipse cx="130" cy="420" rx="65" ry="78" fill="#FF6B6B" opacity="0.9"/>
    <ellipse cx="115" cy="395" rx="18" ry="12" fill="rgba(255,255,255,0.35)" transform="rotate(-30,115,395)"/>
    <line x1="130" y1="498" x2="125" y2="620" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

    <!-- Шарик левый бирюзовый -->
    <ellipse cx="90" cy="600" rx="55" ry="66" fill="#1A9E8F" opacity="0.85"/>
    <ellipse cx="78" cy="580" rx="15" ry="10" fill="rgba(255,255,255,0.3)" transform="rotate(-30,78,580)"/>
    <line x1="90" y1="666" x2="85" y2="780" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

    <!-- Шарик правый розовый -->
    <ellipse cx="950" cy="380" rx="65" ry="78" fill="#FF9FB0" opacity="0.9"/>
    <ellipse cx="935" cy="355" rx="18" ry="12" fill="rgba(255,255,255,0.35)" transform="rotate(-30,935,355)"/>
    <line x1="950" y1="458" x2="945" y2="580" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

    <!-- Шарик правый жёлтый -->
    <ellipse cx="1000" cy="570" rx="58" ry="70" fill="#FFD600" opacity="0.9"/>
    <ellipse cx="986" cy="548" rx="16" ry="11" fill="rgba(255,255,255,0.35)" transform="rotate(-30,986,548)"/>
    <line x1="1000" y1="640" x2="995" y2="760" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

    <!-- Звёзды -->
    <text x="260" y="200" font-size="70" fill="#FFD600" opacity="0.9">★</text>
    <text x="780" y="220" font-size="70" fill="#FFD600" opacity="0.9">★</text>
    <text x="160" y="780" font-size="50" fill="#FFD600" opacity="0.7">★</text>
    <text x="880" y="750" font-size="55" fill="#FFD600" opacity="0.75">★</text>
    <text x="520" y="160" font-size="40" fill="#FFD600" opacity="0.6">★</text>
  </svg>

  <!-- Рамка -->
  <div class="frame"></div>

  <!-- Кофе -->
  <div class="coffee">☕</div>

</div>
</body>
</html>
